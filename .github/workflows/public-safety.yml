name: OSYSTIC Public Showcase Safety

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  public-safety:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Required artifacts
        shell: bash
        run: |
          set -euo pipefail
          for f in README.md case-study.md SECURITY.md NOTICE.md assets/architecture.svg assets/validation.svg docs/technical-overview.md docs/validation-evidence.md docs/lessons-learned.md docs/disclosure-boundary.md docs/standardization-acceptance.md .osystic/repository.yml; do
            test -f "$f"
          done
          grep -Fxq 'repository_class: public-showcase' .osystic/repository.yml
          grep -Fxq 'visibility: public' .osystic/repository.yml
          grep -Fxq '  source_code_included: false' .osystic/repository.yml
          grep -Fxq '  status: completed' .osystic/repository.yml
          grep -Fq 'PUBLIC SHOWCASE · SANITIZED · PORTFOLIO-SAFE' README.md
          grep -Fiq 'Public vs. private repository boundary' README.md
      - name: Block implementation and internal identifiers
        shell: bash
        run: |
          set -euo pipefail
          if git ls-files | grep -Ei '\.(cs|csproj|sln|xaml|ps1|py|js|ts|cpp|c|h|exe|apk|dll|zip|pdb)$'; then
            echo "Implementation or compiled artifact detected"; exit 1
          fi
          if git grep -Ein 'mnexus|mahfuz|facebook' -- ':!*.svg' ':!.github/workflows/public-safety.yml'; then
            echo "Private identifier detected"; exit 1
          fi
      - name: Block secrets and contact data
        shell: bash
        run: |
          set -euo pipefail
          files=()
          while IFS= read -r -d '' f; do
            case "$f" in *.svg|*.png|*.jpg) ;; *) files+=("$f");; esac
          done < <(git ls-files -z)
          if ((${#files[@]})) && grep -EIn --binary-files=without-match '([A-Za-z0-9._%+-]+@[A-Za-z0-9.-]+\.[A-Za-z]{2,})|BEGIN (RSA |EC |OPENSSH )?PRIVATE KEY|AKIA[0-9A-Z]{16}|github_pat_[A-Za-z0-9_]{20,}|gh[pousr]_[A-Za-z0-9]{20,}|sk-[A-Za-z0-9_-]{20,}' "${files[@]}"; then
            echo "Potential secret/contact data"; exit 1
          fi
